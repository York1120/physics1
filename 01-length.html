<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长度读取训练平台</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 95vw;
            max-width: 1200px;
            height: 700px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .title {
            font-size: 36px;  /* 标题字号加大到36px */
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .measurement-area {
            position: relative;
            height: 420px;
            margin-bottom: 20px;
            width: 100%;
        }
        .rectangle {
            position: absolute;
            top: 80px;
            left: 2%;
            width: 96%;
            background-color: #4CAF50;
            height: 100px;
        }
        .ruler {
            position: absolute;
            top: 180px;
            left: 2%;
            width: 96%;
            height: 50px;
            border-top: 3px solid black;
        }
        .ruler-mark {
            position: absolute;
            top: 0;
            width: 1.5px;
            background-color: black;
        }
        .ruler-mark.main {
            height: 25px;
        }
        .ruler-mark.mid {
            height: 20px;
        }
        .ruler-mark.sub {
            height: 15px;
        }
        .ruler-number {
            position: absolute;
            top: 27px;
            font-size: 16px;
            transform: translateX(-50%);
        }
        .ruler-unit {
            position: absolute;
            top: 50px;
            right: 2%;
            font-size: 16px;
        }
        .input-container {
            display: flex;
            width: 100%;
            gap: 20px;
            margin-top: 20px;
        }
        .input-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .input-keyboard {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        input {
            padding: 10px;
            width: 120px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 18px;
            text-align: center;
        }
        button {
            padding: 12px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px 0;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            min-height: 25px;
            font-size: 16px;
        }
        .correct {
            color: green;
        }
        .incorrect {
            color: red;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 15px;
            width: 240px;
        }
        .numpad button {
            padding: 15px;
            font-size: 18px;
        }
        .numpad .zero {
            grid-column: span 2;
        }
        .numpad .decimal {
            grid-column: span 1;
        }
        .numpad .clear {
            grid-column: span 3;
            background-color: #f44336;
        }
        .numpad .clear:hover {
            background-color: #d32f2f;
        }
        .unit-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .unit-btn {
            flex: 1;
            padding: 12px;
            background-color: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .unit-btn.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">长度读取训练平台</div>
        
        <div class="measurement-area">
            <div class="rectangle" id="rectangle"></div>
            <div class="ruler" id="ruler"></div>
        </div>
        
        <div class="input-container">
            <div class="input-controls">
                <h2>测量结果</h2>
                <div class="input-group">
                    <label for="measurement">测量值:</label>
                    <input type="text" id="measurement" readonly>
                </div>
                <div class="input-group">
                    <label>单位:</label>
                    <div class="unit-buttons">
                        <button class="unit-btn active" data-unit="cm">厘米 (cm)</button>
                        <button class="unit-btn" data-unit="mm">毫米 (mm)</button>
                    </div>
                </div>
                <button id="submit">确定</button>
                <button id="new-question">新题目</button>
                <div class="result" id="result"></div>
            </div>
            
            <div class="input-keyboard">
                <h2>数字键盘</h2>
                <div class="numpad">
                    <button class="num-btn" data-value="1">1</button>
                    <button class="num-btn" data-value="2">2</button>
                    <button class="num-btn" data-value="3">3</button>
                    <button class="num-btn" data-value="4">4</button>
                    <button class="num-btn" data-value="5">5</button>
                    <button class="num-btn" data-value="6">6</button>
                    <button class="num-btn" data-value="7">7</button>
                    <button class="num-btn" data-value="8">8</button>
                    <button class="num-btn" data-value="9">9</button>
                    <button class="num-btn zero" data-value="0">0</button>
                    <button class="num-btn decimal" data-value=".">.</button>
                    <button class="clear">清除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rectLength, actualLength, scaleValue, currentUnit = 'cm';
        
        function initMeasurement() {
            rectLength = Math.floor(Math.random() * 201) + 100;
            const rectangle = document.getElementById('rectangle');
            rectangle.style.width = '96%';
            
            const scaleOptions = [0.1, 1];
            scaleValue = scaleOptions[Math.floor(Math.random() * scaleOptions.length)];
            
            const ruler = document.getElementById('ruler');
            ruler.innerHTML = '';
            ruler.style.width = '96%';
            
            const rulerWidthPx = ruler.getBoundingClientRect().width;
            const cmToPx = rulerWidthPx / 20;
            
            for (let i = 0; i <= 20; i += 1) {
                const mainMark = document.createElement('div');
                mainMark.className = 'ruler-mark main';
                mainMark.style.left = (i * cmToPx) + 'px';
                ruler.appendChild(mainMark);
                
                const number = document.createElement('div');
                number.className = 'ruler-number';
                number.textContent = i;
                number.style.left = (i * cmToPx) + 'px';
                ruler.appendChild(number);
                
                if (scaleValue === 0.1 && i < 20) {
                    for (let j = 1; j <= 9; j++) {
                        const subMark = document.createElement('div');
                        const pos = i + j * 0.1;
                        
                        subMark.style.width = '1.5px';
                        
                        if (j === 5) {
                            subMark.className = 'ruler-mark mid';
                        } else {
                            subMark.className = 'ruler-mark sub';
                        }
                        
                        subMark.style.left = (pos * cmToPx) + 'px';
                        ruler.appendChild(subMark);
                    }
                }
            }
            
            const unit = document.createElement('div');
            unit.className = 'ruler-unit';
            unit.textContent = 'cm';
            ruler.appendChild(unit);
            
            const rectWidthPx = (rectLength / 300) * rulerWidthPx;
            rectangle.style.width = rectWidthPx + 'px';
            actualLength = rectWidthPx / cmToPx;
            
            document.getElementById('measurement').value = '';
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = 'result';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initMeasurement();
            
            const measurementInput = document.getElementById('measurement');
            
            document.querySelectorAll('.unit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.unit-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    currentUnit = this.getAttribute('data-unit');
                });
            });
            
            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    
                    if (value === '.') {
                        if (measurementInput.value === '') {
                            measurementInput.value = '0.';
                        } else if (!measurementInput.value.includes('.')) {
                            measurementInput.value += value;
                        }
                    } else {
                        measurementInput.value += value;
                    }
                });
            });
            
            document.querySelector('.clear').addEventListener('click', function() {
                measurementInput.value = '';
            });
            
            document.getElementById('submit').addEventListener('click', function() {
                const userInput = parseFloat(measurementInput.value);
                const resultDiv = document.getElementById('result');
                
                if (isNaN(userInput)) {
                    resultDiv.textContent = '请输入有效的测量值';
                    resultDiv.className = 'result incorrect';
                    return;
                }
                
                let userLengthInCm = userInput;
                if (currentUnit === 'mm') {
                    userLengthInCm = userInput / 10;
                }
                
                const tolerance = 0.1;
                const isCorrect = Math.abs(userLengthInCm - actualLength) <= tolerance;
                
                const decimalPlaces = scaleValue === 1 ? 1 : 2;
                const formattedLength = actualLength.toFixed(decimalPlaces);
                
                if (isCorrect) {
                    resultDiv.textContent = '正确！实际长度为 ' + formattedLength + ' cm';
                    resultDiv.className = 'result correct';
                } else {
                    resultDiv.textContent = '错误。实际长度为 ' + formattedLength + ' cm';
                    resultDiv.className = 'result incorrect';
                }
            });
            
            document.getElementById('new-question').addEventListener('click', function() {
                initMeasurement();
            });
        });
    </script>
</body>
</html>
